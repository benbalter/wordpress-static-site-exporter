name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Cancel superseded pull request runs so only the latest commit is tested.
# Pushes to main are never cancelled, so every merged commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpunit:

    runs-on: ubuntu-latest
    strategy: 
      matrix:
        php_version: [8.4]
        wp_version: [latest, '6.8', '6.9']
        wp_multisite: [0]
        include:
          - php_version: 8.3
            wp_version: latest
            wp_multisite: 1
          # The minimum supported versions (Requires PHP / Requires at least).
          - php_version: 8.2
            wp_version: '6.4'
            wp_multisite: 0

    services:
      mysql:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        
    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_version }}
        extensions: mysqli
        coverage: xdebug
        tools: phpunit-polyfills

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install composer dependencies
      run: rm -rf vendor && composer install --prefer-dist --no-progress

    - name: Install SVN
      run: sudo apt-get install -y subversion
      
    - name: Setup WP
      run: script/setup
      env:
        WP_VERSION: ${{ matrix.wp_version }}
        WP_MULTISITE: ${{ matrix.wp_multisite }}
        
    - name: PHPUnit
      run: script/cibuild-phpunit
      env:
        WP_MULTISITE: ${{ matrix.wp_multisite }}

    - name: Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        directory: ${{ github.workspace }}
        verbose: true
        flags: php-${{ matrix.php_version }}, wp-${{ matrix.wp_version }}, multisite-${{ matrix.wp_multisite }}

  phpcs:
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        php_version: [8.3]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: rm -rf vendor && composer install --prefer-dist --no-progress
      
      - name: phpcs
        run: script/cibuild-phpcs

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: rm -rf vendor && composer install --prefer-dist --no-progress

      - name: PHPStan
        run: script/cibuild-phpstan

  vendor-autoload:
    name: Verify vendor autoload files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify no dev dependencies in committed autoload files
        run: |
          dev_packages="phpunit|php-coveralls|wpcs|wp-cli|yoast|phpstan|szepeviktor"
          for file in vendor/composer/autoload_files.php vendor/composer/autoload_psr4.php vendor/composer/autoload_static.php; do
            if grep -qiE "$dev_packages" "$file"; then
              echo "::error::$file contains dev dependency references. Run 'script/vendor' and commit the result."
              grep -iE "$dev_packages" "$file"
              exit 1
            fi
          done
          echo "Vendor autoload files look clean — no dev dependency references found."

      # The plugin ships the committed vendor/, but tests run against a fresh
      # `composer install`, so a file missing from git never fails a test.
      # That is how 4.4.0 shipped without classes the converter needed.
      # Rebuild runtime dependencies from composer.lock and require that git
      # sees no difference: no missing, extra, or changed files.
      # installed.json and installed.php only record how Composer ran, and
      # they differ between Composer versions, so they're left out.
      - name: Verify committed vendor/ matches composer.lock
        run: |
          rm -rf vendor
          composer install --no-dev --no-interaction --no-progress
          paths="vendor :(exclude)vendor/composer/installed.json :(exclude)vendor/composer/installed.php"
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            echo "::error::Committed vendor/ differs from a fresh 'composer install --no-dev'. Run 'script/vendor' and commit the result."
            git status --porcelain -- $paths
            git diff --stat -- $paths
            exit 1
          fi
          echo "Committed vendor/ matches composer.lock."

  readme:
    name: Verify readme.txt is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # script/build-readme is plain Ruby with no gems, so Ruby itself is the
      # only dependency.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      # readme.txt is generated from docs/ and committed for WordPress.org.
      # Without this check an edit to docs/ that skips the generator ships a
      # stale readme.
      - name: Regenerate readme.txt and fail on drift
        run: |
          script/build-readme
          if ! git diff --exit-code readme.txt; then
            echo "::error file=readme.txt::readme.txt is out of date. Run script/build-readme and commit the result."
            exit 1
          fi

  # Runtime dependencies ship inside the plugin (vendor/), so an advisory
  # against one reaches every site. Dev dependencies never ship and are
  # excluded. Reads composer.lock only; no install needed.
  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: composer audit
        run: composer audit --no-dev

  # WordPress.org Plugin Check against the same file set that ships: .distignore
  # is applied first, so dev-only files (tests, scripts, configs) never produce
  # findings. vendor/ is third-party code the plugin doesn't control, so it is
  # excluded from the check.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble distribution copy
        run: |
          mkdir -p plugin-dist
          rsync -a --exclude='/plugin-dist' --exclude-from=.distignore ./ plugin-dist/

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin-dist
          # The copy lives in ./plugin-dist, so name the slug explicitly or the
          # directory name is used and the text-domain check flags every string.
          slug: jekyll-exporter
          exclude-directories: 'vendor'
