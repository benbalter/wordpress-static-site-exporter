<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <title>Static Site Exporter: WordPress to Markdown for Jekyll, Hugo, and more</title>
  <!--
    WordPress.org overlays the plugin name on the bottom-left of the banner,
    so everything that matters stays in the top 340px on the left and on the
    right-hand side. Rendered by script/build-wporg-assets.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#334155"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f4c20d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f4c20d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#dots)" opacity="0.55"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <!-- The box mark from icon.svg, without its tile. -->
  <g transform="translate(84 58) scale(0.62)">
    <path d="M128 92 L58 64 L58 162 L128 196 Z" fill="#f4c20d"/>
    <path d="M128 92 L198 64 L198 162 L128 196 Z" fill="#d9a800"/>
    <path d="M58 64 L128 36 L198 64 L128 92 Z" fill="#ffd94a"/>
    <path d="M93 50 L163 78 L163 88 L93 60 Z" fill="#e0b000" opacity="0.9"/>
    <g transform="matrix(1 0.4 0 1 0 0)" fill="#0f172a">
      <path d="M70 72 h9 l8 12 l8 -12 h9 v36 h-9 v-21 l-8 12 l-8 -12 v21 h-9 Z"/>
      <path d="M111 72 h8 v19 h7 l-11 15 l-11 -15 h7 Z"/>
    </g>
  </g>

  <text x="230" y="150" font-family="Inter" font-weight="800" font-size="74" fill="#f8fafc" letter-spacing="-1.5">Static Site Exporter</text>
  <text x="232" y="206" font-family="Inter" font-weight="400" font-size="32" fill="#cbd5e1">WordPress to Markdown for Jekyll, Hugo, and more</text>

  <!-- What you get, as pills. -->
  <g font-family="Inter" font-weight="600" font-size="22" fill="#e2e8f0">
    <rect x="232" y="242" width="222" height="44" rx="22" fill="#1e293b" stroke="#475569"/>
    <text x="343" y="271" text-anchor="middle">Markdown + YAML</text>
    <rect x="468" y="242" width="186" height="44" rx="22" fill="#1e293b" stroke="#475569"/>
    <text x="561" y="271" text-anchor="middle">Media + URLs</text>
    <rect x="668" y="242" width="124" height="44" rx="22" fill="#1e293b" stroke="#475569"/>
    <text x="730" y="271" text-anchor="middle">WP-CLI</text>
  </g>

  <!-- An exported post, as a file card. -->
  <g transform="translate(1036 62) rotate(-3)" filter="url(#shadow)">
    <rect width="420" height="356" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect width="420" height="48" rx="18" fill="#1e293b"/>
    <rect y="30" width="420" height="18" fill="#1e293b"/>
    <circle cx="28" cy="24" r="7" fill="#f87171"/>
    <circle cx="50" cy="24" r="7" fill="#fbbf24"/>
    <circle cx="72" cy="24" r="7" fill="#34d399"/>
    <text x="98" y="31" font-family="JetBrains Mono" font-size="18" fill="#94a3b8">_posts/2026-11-05-hello.md</text>
    <g font-family="JetBrains Mono" font-size="21" xml:space="preserve">
      <text x="28" y="94" fill="#64748b">---</text>
      <text x="28" y="126"><tspan fill="#f4c20d">title:</tspan><tspan fill="#e2e8f0"> Hello, world</tspan></text>
      <text x="28" y="158"><tspan fill="#f4c20d">date:</tspan><tspan fill="#e2e8f0"> 2026-11-05</tspan></text>
      <text x="28" y="190"><tspan fill="#f4c20d">categories:</tspan><tspan fill="#e2e8f0"> [news]</tspan></text>
      <text x="28" y="222"><tspan fill="#f4c20d">permalink:</tspan><tspan fill="#e2e8f0"> /hello/</tspan></text>
      <text x="28" y="254" fill="#64748b">---</text>
      <text x="28" y="298" fill="#7dd3fc"># Hello, world</text>
      <text x="28" y="330" fill="#cbd5e1">Now with **less** PHP.</text>
    </g>
  </g>
</svg>
